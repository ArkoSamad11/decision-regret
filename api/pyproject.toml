[project]
name = "xdr"
version = "0.1.0"
description = "Expected decision regret — possession-value counterfactuals with calibration under transfer"
requires-python = ">=3.11"
dependencies = [
    "statsbombpy>=1.14,<2",
    "socceraction>=1.4,<2",
    "pandas>=2.2,<3",
    "pyarrow>=17,<19",
    "duckdb>=1.0,<2",
    "lightgbm>=4.3,<5",
    "scikit-learn>=1.5,<2",
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "pydantic>=2.8,<3",
    "pydantic-settings>=2.4,<3",
    "pyyaml>=6.0,<7",
    "requests>=2.32,<3",
    "joblib>=1.4,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9",
    "pytest-cov>=5.0,<6",
    "ruff>=0.6,<1",
    "httpx>=0.27,<1",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=xdr --cov-report=term-missing"
