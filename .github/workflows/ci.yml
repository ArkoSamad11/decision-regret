name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: api
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: ruff
        working-directory: api
        run: ruff check src tests

      # No artifacts/ in CI (StatsBomb ingest + training needs real network
      # access and several minutes; not run on every push). Tests that need
      # a built artifacts/xdr.duckdb skip themselves via HAS_ARTIFACTS in
      # test_api.py -- everything else, including the counterfactual,
      # support-gate, coordinate, and label-leakage property tests, still
      # runs against synthetic fixtures.
      - name: pytest
        working-directory: api
        run: pytest tests

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        working-directory: web
        run: npm ci

      - name: typecheck
        working-directory: web
        run: npm run typecheck

      - name: build
        working-directory: web
        env:
          API_ORIGIN: http://localhost:8000
        run: npm run build
